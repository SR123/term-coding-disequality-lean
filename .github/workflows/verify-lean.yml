name: Verify Lean (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get the pinned Mathlib cache
        run: lake exe cache get
      - name: Build all 71 project modules
        run: lake build
      - name: Run the six recorded audit and type commands
        run: |
          for module in Audit AuditClaude AuditGeneral AuditMachineRuntime TypesGeneral TypesMachineRuntime; do
            lake env lean "$module.lean"
          done
