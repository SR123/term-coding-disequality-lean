name: Publish interactive paper
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the prepared companion to GitHub Pages
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Choose the Pages path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            echo 'PAPER_BASE_PATH=' >> "$GITHUB_ENV"
          else
            echo "PAPER_BASE_PATH=/$repository_name" >> "$GITHUB_ENV"
          fi
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-artifact@v4
        with:
          name: interactive-paper
          path: site/dist/client
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name == 'push' || inputs.publish }}
        with:
          path: site/dist/client
  deploy:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
